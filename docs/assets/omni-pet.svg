<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="100%" height="340" style="cursor: pointer; user-select: none;">
  <defs>
    <!-- Soft Glow Filters -->
    <filter id="glow-ambient-green" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-ambient-red" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-green-eyes" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-red-eyes" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* 1. SMOOTH ROAMING IN ITS DESIGNATED AREA */
      @keyframes roamPlayground {
        0%   { transform: translate(160px, 95px); }
        20%  { transform: translate(250px, 65px); }
        40%  { transform: translate(340px, 105px); }
        60%  { transform: translate(260px, 145px); }
        80%  { transform: translate(130px, 115px); }
        100% { transform: translate(160px, 95px); }
      }
      /* Hovering vertical bob */
      @keyframes floatBob {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-7px); }
      }
      /* Speech bubble float */
      @keyframes zzzFloat {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-4px); }
      }
      /* Aura breath */
      @keyframes auraBreath {
        0%, 100% { opacity: 0.35; transform: scale(0.95); }
        50%      { opacity: 0.70; transform: scale(1.10); }
      }
      /* Rage screen-shake when angry */
      @keyframes rageShake {
        0%   { transform: translate(0px, 0px) rotate(0deg); }
        20%  { transform: translate(-3px, 2px) rotate(-1.5deg); }
        40%  { transform: translate(3px, -2px) rotate(1.5deg); }
        60%  { transform: translate(-3px, -1px) rotate(-1deg); }
        80%  { transform: translate(3px, 2px) rotate(1deg); }
        100% { transform: translate(0px, 0px) rotate(0deg); }
      }
      /* Anger vein pulse */
      @keyframes veinPulse {
        0%, 100% { transform: scale(0.95); opacity: 0.8; }
        50%      { transform: scale(1.18); opacity: 1; }
      }

      .roaming-actor {
        animation: roamPlayground 14s ease-in-out infinite;
      }
      .bobbing-body {
        animation: floatBob 2.8s ease-in-out infinite;
        transform-origin: 32px 36px;
      }
      .speech-zzz-bubble {
        animation: zzzFloat 2.8s ease-in-out infinite;
      }
      .ambient-green-halo {
        animation: auraBreath 3.2s ease-in-out infinite;
        transform-origin: 32px 36px;
      }
      .angry-shaker {
        animation: rageShake 0.4s ease-in-out infinite;
        transform-origin: 270px 170px;
      }
      .anger-mark {
        animation: veinPulse 0.8s ease-in-out infinite;
        transform-origin: 308px 115px;
      }

      /* ============================================================
         INTERACTIVE STATE TOGGLE:
         Default: Omni is peacefully Roaming & Sleeping
         Hover / Active / Touch: Omni turns ANGRY instantly!
         ============================================================ */
      .pet-state-sleeping {
        display: block;
      }
      .pet-state-angry {
        display: none;
      }

      /* When user touches / hovers / clicks ANYWHERE on the pet */
      svg:hover .pet-state-sleeping,
      svg:active .pet-state-sleeping {
        display: none !important;
      }
      svg:hover .pet-state-angry,
      svg:active .pet-state-angry {
        display: block !important;
      }

      svg:hover .chamber-bg,
      svg:active .chamber-bg {
        stroke: #991B1B !important;
      }
      svg:hover .top-banner,
      svg:active .top-banner {
        fill: #450A0A !important;
        stroke: #991B1B !important;
      }
    </style>
  </defs>

  <!-- Deep space playground background matching DealMesh website -->
  <rect class="chamber-bg" width="100%" height="100%" rx="16" fill="#030712" stroke="#1F2937" stroke-width="1.5" />

  <!-- Subtle starfield/playground dots -->
  <g opacity="0.15" fill="#38BDF8">
    <circle cx="80" cy="80" r="1.5" />
    <circle cx="200" cy="65" r="1.5" />
    <circle cx="340" cy="90" r="1.5" />
    <circle cx="450" cy="150" r="1.5" />
    <circle cx="280" cy="250" r="1.5" />
    <circle cx="110" cy="220" r="1.5" />
  </g>

  <!-- ============================================================
       STATE 1: SLEEPING & ROAMING (Default State)
       ============================================================ -->
  <g class="pet-state-sleeping">
    <!-- Top Status Banner -->
    <rect class="top-banner" x="20" y="16" width="500" height="30" rx="15" fill="#111827" stroke="#374151" stroke-width="1" />
    <circle cx="38" cy="31" r="5" fill="#84CC16">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="52" y="36" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" font-weight="600">
      Omni is peacefully roaming &amp; sleeping in his area... <tspan fill="#F59E0B" font-weight="bold">👉 Touch / Click me to poke!</tspan>
    </text>

    <!-- The Robot Actor roaming around in its designated area -->
    <g class="roaming-actor">
      <!-- Ambient Holographic Glow Halo -->
      <ellipse class="ambient-green-halo" cx="32" cy="38" rx="46" ry="46" fill="#84CC16" opacity="0.45" filter="url(#glow-ambient-green)" />

      <g class="bobbing-body">
        <!-- SPEECH BUBBLE: "Zzz..." Cleanly positioned ABOVE head with zero overlap -->
        <g class="speech-zzz-bubble" transform="translate(6, -46)">
          <rect x="0" y="0" width="68" height="30" rx="15" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" />
          <polygon points="32,30 46,30 39,39" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />
          <polygon points="31,28 47,28 39,37" fill="#FFFFFF" />
          <text x="34" y="21" font-family="'Courier New', monospace, -apple-system, sans-serif" font-size="14.5px" font-weight="900" fill="#0F172A" text-anchor="middle">Zzz...</text>
        </g>

        <!-- EXACT PIXELPET VOXEL ROBOT (from PixelPet.tsx) -->
        <g transform="scale(1.35) translate(-4, 0)">
          <!-- Dome Armor -->
          <rect x="24" y="2" width="16" height="4" fill="#FFFFFF" />
          <rect x="20" y="4" width="24" height="4" fill="#F8FAFC" />
          <rect x="18" y="4" width="4" height="4" fill="#E2E8F0" />
          <rect x="42" y="4" width="4" height="4" fill="#94A3B8" />

          <!-- Cat/Robot Corner Ears -->
          <polygon points="16,8 22,2 24,8" fill="#FFFFFF" />
          <polygon points="18,7 22,3 23,7" fill="#84CC16" />
          <polygon points="48,8 42,2 40,8" fill="#94A3B8" />
          <polygon points="46,7 42,3 41,7" fill="#84CC16" />

          <!-- Head Shell -->
          <rect x="14" y="8" width="36" height="26" fill="#FFFFFF" rx="4" />
          <rect x="12" y="10" width="4" height="22" fill="#F1F5F9" />
          <rect x="14" y="8" width="4" height="24" fill="#E2E8F0" />
          <rect x="46" y="10" width="6" height="22" fill="#64748B" />
          <rect x="42" y="8" width="4" height="24" fill="#94A3B8" />

          <!-- Visor Cavity -->
          <rect x="16" y="14" width="32" height="18" fill="#060913" rx="4" />
          <rect x="18" y="16" width="28" height="14" fill="#02040A" />

          <!-- Sleeping Eyes: Soft Closed Eye Slits (Lime Green #84CC16) -->
          <g filter="url(#glow-green-eyes)">
            <rect x="20" y="22" width="9" height="3" rx="1.5" fill="#84CC16" opacity="0.95" />
            <rect x="35" y="22" width="9" height="3" rx="1.5" fill="#84CC16" opacity="0.95" />
          </g>

          <!-- Lower Torso -->
          <rect x="14" y="36" width="36" height="14" fill="#FFFFFF" />
          <rect x="12" y="36" width="4" height="14" fill="#E2E8F0" />
          <rect x="46" y="36" width="4" height="14" fill="#64748B" />
          <rect x="42" y="36" width="4" height="14" fill="#94A3B8" />

          <!-- Chest Core (Lime Green) -->
          <rect x="28" y="40" width="8" height="6" fill="#84CC16" rx="2" filter="url(#glow-green-eyes)" />
          <rect x="30" y="42" width="4" height="2" fill="#FFFFFF" opacity="0.9" />

          <!-- Hover Thrusters (3 Pointed Teeth / Spikes) -->
          <polygon points="16,50 24,50 20,58" fill="#CBD5E1" />
          <polygon points="28,50 36,50 32,58" fill="#FFFFFF" />
          <polygon points="40,50 48,50 44,58" fill="#94A3B8" />
        </g>
      </g>
    </g>
  </g>

  <!-- ============================================================
       STATE 2: ANGRY POKED STATE (Active when touched/clicked/hovered)
       ============================================================ -->
  <g class="pet-state-angry">
    <!-- Top Status Warning Banner -->
    <rect x="20" y="14" width="500" height="30" rx="15" fill="#450A0A" stroke="#EF4444" stroke-width="1.5" />
    <circle cx="38" cy="29" r="5" fill="#EF4444">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="0.8s" repeatCount="indefinite" />
    </circle>
    <text x="52" y="34" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" font-weight="700">
      ⚡ OUCH! You poked Omni! Say &quot;Hey Omni&quot; to search instead!
    </text>

    <!-- SPEECH BUBBLE: Exactly matching user screenshot & FreeRoamingPet.tsx -->
    <!-- Pinkish border #E11D48 with white background -->
    <g transform="translate(65, 54)">
      <rect x="0" y="0" width="410" height="58" rx="20" fill="#FFF5F5" stroke="#E11D48" stroke-width="3" />
      <!-- Downward arrow pointing directly at robot head -->
      <polygon points="195,58 215,58 205,70" fill="#FFF5F5" stroke="#E11D48" stroke-width="3" stroke-linejoin="round" />
      <polygon points="194,55 216,55 205,67" fill="#FFF5F5" />
      
      <text x="205" y="26" font-family="'Courier New', monospace, sans-serif" font-size="13.5px" font-weight="900" fill="#1E293B" text-anchor="middle">
        Do not poke me! Say Hey Omni if
      </text>
      <text x="205" y="44" font-family="'Courier New', monospace, sans-serif" font-size="13.5px" font-weight="900" fill="#1E293B" text-anchor="middle">
        you want a search!
      </text>
    </g>

    <!-- ANGRY ROBOT ACTOR (Centered & Shaking) -->
    <g class="angry-shaker" transform="translate(230, 130)">
      <!-- Pulsing Red Anger Halo -->
      <ellipse cx="38" cy="40" rx="55" ry="55" fill="#EF4444" opacity="0.55" filter="url(#glow-ambient-red)" />

      <!-- Anger mark veins 💢 pulsing at top right of head -->
      <g class="anger-mark" transform="translate(68, 0)">
        <text x="0" y="10" fill="#EF4444" font-size="16" font-weight="black" font-family="sans-serif">💢</text>
      </g>

      <!-- EXACT PIXELPET VOXEL ROBOT IN ANGRY MODE -->
      <g transform="scale(1.45) translate(-4, 0)">
        <!-- Dome Armor -->
        <rect x="24" y="2" width="16" height="4" fill="#FFFFFF" />
        <rect x="20" y="4" width="24" height="4" fill="#F8FAFC" />
        <rect x="18" y="4" width="4" height="4" fill="#E2E8F0" />
        <rect x="42" y="4" width="4" height="4" fill="#94A3B8" />

        <!-- Cat/Robot Corner Ears -->
        <polygon points="16,8 22,2 24,8" fill="#FFFFFF" />
        <polygon points="18,7 22,3 23,7" fill="#84CC16" />
        <polygon points="48,8 42,2 40,8" fill="#94A3B8" />
        <polygon points="46,7 42,3 41,7" fill="#84CC16" />

        <!-- Head Shell with Red Outline Alert -->
        <rect x="14" y="8" width="36" height="26" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.2" rx="4" />
        <rect x="12" y="10" width="4" height="22" fill="#F1F5F9" />
        <rect x="14" y="8" width="4" height="24" fill="#E2E8F0" />
        <rect x="46" y="10" width="6" height="22" fill="#64748B" />
        <rect x="42" y="8" width="4" height="24" fill="#94A3B8" />

        <!-- Visor Cavity -->
        <rect x="16" y="14" width="32" height="18" fill="#060913" rx="4" />
        <rect x="18" y="16" width="28" height="14" fill="#02040A" />

        <!-- ANGRY FIERCE SLANTED EYES (Exact polygon code from PixelPet.tsx lines 187-190) -->
        <g filter="url(#glow-red-eyes)">
          <polygon points="18,18 30,24 28,27 18,21" fill="#EF4444" />
          <polygon points="46,18 34,24 36,27 46,21" fill="#EF4444" />
          <rect x="22" y="22" width="4" height="3" fill="#FCA5A5" />
          <rect x="38" y="22" width="4" height="3" fill="#FCA5A5" />
        </g>

        <!-- Lower Torso -->
        <rect x="14" y="36" width="36" height="14" fill="#FFFFFF" />
        <rect x="12" y="36" width="4" height="14" fill="#E2E8F0" />
        <rect x="46" y="36" width="4" height="14" fill="#64748B" />
        <rect x="42" y="36" width="4" height="14" fill="#94A3B8" />

        <!-- Chest Core (Glowing Angry Red) -->
        <rect x="28" y="40" width="8" height="6" fill="#EF4444" rx="2" filter="url(#glow-red-eyes)" />
        <rect x="30" y="42" width="4" height="2" fill="#FFFFFF" opacity="0.9" />

        <!-- Hover Thrusters (3 Pointed Teeth / Spikes) -->
        <polygon points="16,50 24,50 20,58" fill="#CBD5E1" />
        <polygon points="28,50 36,50 32,58" fill="#FFFFFF" />
        <polygon points="40,50 48,50 44,58" fill="#94A3B8" />
      </g>
    </g>

    <!-- Prompt Bar: "If you want to use me, use the above repo!" -->
    <g transform="translate(35, 292)">
      <rect x="0" y="0" width="470" height="34" rx="8" fill="#180B0F" stroke="#B91C1C" stroke-width="1.2" />
      <text x="235" y="22" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5px" font-weight="700" text-anchor="middle">
        🤖 <tspan fill="#FDE047">If you want to use me, use the above repo!</tspan> Run: <tspan fill="#38BDF8">npm run dev:all</tspan>
      </text>
    </g>
  </g>
</svg>
