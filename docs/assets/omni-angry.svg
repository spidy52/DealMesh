<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="100%" height="300">
  <defs>
    <filter id="glow-red" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-anger" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes rageShake {
        0% { transform: translate(0, 0) rotate(0deg); }
        20% { transform: translate(-3px, 2px) rotate(-1.5deg); }
        40% { transform: translate(3px, -2px) rotate(1.5deg); }
        60% { transform: translate(-3px, -1px) rotate(-1deg); }
        80% { transform: translate(3px, 2px) rotate(1deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
      }
      @keyframes pulseRedAura {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.15); }
      }
      @keyframes veinPulse {
        0%, 100% { opacity: 0.7; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      .angry-actor {
        animation: rageShake 0.45s ease-in-out infinite;
        transform-origin: 230px 200px;
      }
      .anger-vein {
        animation: veinPulse 0.8s ease-in-out infinite;
        transform-origin: 275px 145px;
      }
      .red-aura {
        animation: pulseRedAura 1.5s ease-in-out infinite;
        transform-origin: 230px 200px;
      }
    </style>
  </defs>

  <!-- Dark Atmospheric Chamber Container -->
  <rect width="100%" height="100%" rx="18" fill="#0A0608" stroke="#7F1D1D" stroke-width="2" />

  <!-- Subtle Warning Grid in background -->
  <g opacity="0.08" stroke="#EF4444" stroke-width="0.8">
    <line x1="40" y1="0" x2="40" y2="320" />
    <line x1="120" y1="0" x2="120" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="280" y1="0" x2="280" y2="320" />
    <line x1="360" y1="0" x2="360" y2="320" />
    <line x1="440" y1="0" x2="440" y2="320" />
    <line x1="0" y1="60" x2="460" y2="60" />
    <line x1="0" y1="140" x2="460" y2="140" />
    <line x1="0" y1="220" x2="460" y2="220" />
  </g>

  <!-- Speech Bubble: "Do not poke me! Say Hey Omni if you want a search!" -->
  <g transform="translate(45, 18)">
    <rect x="0" y="0" width="370" height="74" rx="22" fill="#FFF5F5" stroke="#E11D48" stroke-width="3.5" />
    <!-- Downward speech pointer triangle directed at Omni's head -->
    <polygon points="175,74 195,74 185,90" fill="#FFF5F5" stroke="#E11D48" stroke-width="3.5" stroke-linejoin="round" />
    <polygon points="174,70 196,70 185,86" fill="#FFF5F5" />
    
    <text x="185" y="32" font-family="'Courier New', monospace, sans-serif" font-size="14px" font-weight="900" fill="#1E293B" text-anchor="middle">
      Do not poke me! Say Hey Omni if
    </text>
    <text x="185" y="54" font-family="'Courier New', monospace, sans-serif" font-size="14px" font-weight="900" fill="#1E293B" text-anchor="middle">
      you want a search!
    </text>
  </g>

  <!-- Angry Robot Group -->
  <g class="angry-actor">
    <!-- Glowing Soft Red Anger Halo -->
    <ellipse class="red-aura" cx="230" cy="200" rx="75" ry="75" fill="#DC2626" opacity="0.4" filter="url(#glow-anger)" />

    <!-- Pulsing Red Anger Mark (Veins) on top-right of head -->
    <g class="anger-vein" transform="translate(268, 130)">
      <path d="M 0,0 L 16,16 M 16,0 L 0,16 M 8,0 L 8,16 M 0,8 L 16,8" stroke="#F43F5E" stroke-width="3" stroke-linecap="round" filter="url(#glow-red)" />
    </g>

    <g transform="translate(175, 140)">
      <!-- Antenna Ears (Small Yellow/Green Triangles) -->
      <polygon points="16,14 26,0 36,14" fill="#84CC16" />
      <polygon points="74,14 84,0 94,14" fill="#84CC16" />

      <!-- Head Chassis -->
      <path d="M 12,14 L 98,14 Q 104,14 104,22 L 104,78 Q 104,84 98,84 L 12,84 Q 6,84 6,78 L 6,22 Q 6,14 12,14 Z" fill="#E2E8F0" stroke="#EF4444" stroke-width="2.5" />
      <rect x="12" y="10" width="86" height="8" rx="3" fill="#FEE2E2" />

      <!-- Dark Visor Screen with Red Tint -->
      <rect x="16" y="24" width="78" height="46" rx="10" fill="#1C0507" stroke="#991B1B" stroke-width="1.8" />

      <!-- Fierce Slanted Angry Red Eyes (Exact match to screenshot) -->
      <g filter="url(#glow-red)">
        <!-- Left Angry Eye (Slanted Inward-Down) -->
        <polygon points="26,38 48,46 46,55 24,47" fill="#EF4444" />
        <!-- Right Angry Eye (Slanted Inward-Down) -->
        <polygon points="84,38 62,46 64,55 86,47" fill="#EF4444" />
      </g>

      <!-- Torso / Lower Body -->
      <path d="M 16,88 L 94,88 L 90,122 L 20,122 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.8" />
      
      <!-- Core Status LED (Angry Red Pill) -->
      <rect x="42" y="96" width="26" height="14" rx="4" fill="#1C0507" stroke="#EF4444" stroke-width="1.5" />
      <rect x="46" y="99" width="18" height="8" rx="3" fill="#EF4444" filter="url(#glow-red)" />

      <!-- Hover Thrusters (3 Inverted White/Grey Spikes) -->
      <polygon points="26,122 35,138 44,122" fill="#CBD5E1" />
      <polygon points="48,122 55,142 62,122" fill="#E2E8F0" />
      <polygon points="66,122 75,138 84,122" fill="#CBD5E1" />

      <!-- Angry Flame Sparks -->
      <ellipse cx="55" cy="144" rx="20" ry="5" fill="#EF4444" opacity="0.8" filter="url(#glow-red)" />
    </g>
  </g>

  <!-- Repo Callout at Bottom -->
  <rect x="30" y="278" width="400" height="30" rx="8" fill="#180B0F" stroke="#7F1D1D" stroke-width="1" />
  <text x="230" y="298" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" font-weight="700" text-anchor="middle">
    🤖 Want to use me? Clone this repo above and run: <tspan fill="#67E8F9">npm run dev:all</tspan>
  </text>
</svg>
