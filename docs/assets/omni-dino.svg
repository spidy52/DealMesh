<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="100%" height="260">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style><![CDATA[
      /* ==========================================================
         PERFECT DINO RUNNER PHYSICS (Locked to Ground Y=200)
         Cycle: 3.2s
         ========================================================== */

      /* Ground dashes scrolling to the left */
      @keyframes groundScroll {
        0%   { transform: translateX(0px); }
        100% { transform: translateX(-68px); }
      }

      /* Hurdle 1 ($$$ Markup): Locked to ground level Y=168px */
      @keyframes hurdleScroll1 {
        0%   { transform: translate(680px, 168px); }
        100% { transform: translate(-80px, 168px); }
      }

      /* Hurdle 2 (High Fee Spike): Locked to ground level Y=168px */
      @keyframes hurdleScroll2 {
        0%   { transform: translate(1080px, 168px); }
        100% { transform: translate(-80px, 168px); }
      }

      /* Deal Bag item: Floating mid-air at Y=112px */
      @keyframes dealScroll {
        0%   { transform: translate(880px, 112px); }
        100% { transform: translate(-80px, 112px); }
      }

      /* Omni Running + Jump Physics:
         Ground Y = 144px (feet touch line at 200px)
         Jump Peak Y = 84px (cleanly clears 32px hurdle at 168px)
         Hurdle 1 reaches x=90 at 77.6% (2.48s)
         Hurdle 2 reaches x=90 at 36.2% (1.16s)
      */
      @keyframes omniRunner {
        0%, 28%   { transform: translate(90px, 144px); } /* Running */
        31%       { transform: translate(90px, 148px); } /* Crouch */
        37%, 45%  { transform: translate(90px, 84px) rotate(-8deg); } /* JUMP 1 over Hurdle 2! */
        51%       { transform: translate(90px, 144px); } /* Land */
        68%       { transform: translate(90px, 144px); } /* Running */
        71%       { transform: translate(90px, 148px); } /* Crouch */
        77%, 85%  { transform: translate(90px, 84px) rotate(-8deg); } /* JUMP 2 over Hurdle 1! */
        91%, 100% { transform: translate(90px, 144px); } /* Land & Run */
      }

      /* Running leg/thruster pulse */
      @keyframes legTrot {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-3px); }
      }

      /* Cloud drift */
      @keyframes cloudDrift1 {
        0%   { transform: translate(680px, 75px); }
        100% { transform: translate(-100px, 75px); }
      }
      @keyframes cloudDrift2 {
        0%   { transform: translate(960px, 95px); }
        100% { transform: translate(-100px, 95px); }
      }

      .ground-track {
        animation: groundScroll 0.5s linear infinite;
      }
      .hurdle-1 {
        animation: hurdleScroll1 3.2s linear infinite;
      }
      .hurdle-2 {
        animation: hurdleScroll2 3.2s linear infinite;
      }
      .deal-bag {
        animation: dealScroll 3.2s linear infinite;
      }
      .omni-player {
        animation: omniRunner 3.2s cubic-bezier(0.35, 0, 0.25, 1) infinite;
      }
      .trotting-body {
        animation: legTrot 0.25s ease-in-out infinite;
      }
      .cloud-1 {
        animation: cloudDrift1 18s linear infinite;
      }
      .cloud-2 {
        animation: cloudDrift2 24s linear infinite;
      }
    ]]></style>
  </defs>

  <!-- Deep space CRT arcade background -->
  <rect width="100%" height="100%" rx="14" fill="#030712" stroke="#1F2937" stroke-width="1.5" />

  <!-- ==========================================================
       HEADER: Tagline & Hackathon Track Badge (NO Razorpay)
       ========================================================== -->
  <g transform="translate(24, 20)">
    <!-- Tagline -->
    <text x="0" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5px" font-weight="900" letter-spacing="0.3px">
      &quot;One AI Buyer. Every Store. Zero Overpaying.&quot;
    </text>

    <!-- Track Badge (Razorpay removed cleanly) -->
    <text x="0" y="34" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5px" font-weight="700">
      <tspan fill="#A855F7">Track 01:</tspan> AI Growth &amp; Agentic Commerce — <tspan fill="#F59E0B">Powered by DMCP Protocol</tspan>
    </text>

    <!-- Retro 8-bit High Score Ticker (Top Right) -->
    <text x="632" y="24" fill="#64748B" font-family="'Courier New', monospace, sans-serif" font-size="11.5px" font-weight="900" text-anchor="end">
      HI <tspan fill="#94A3B8">09999</tspan>   <tspan fill="#84CC16">DEALS 00420</tspan>
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="24" y1="58" x2="656" y2="58" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />

  <!-- ==========================================================
       DINO SKY: Clouds
       ========================================================== -->
  <g class="cloud-1" opacity="0.25">
    <rect x="0" y="0" width="36" height="8" rx="4" fill="#64748B" />
    <rect x="8" y="-6" width="20" height="8" rx="4" fill="#64748B" />
  </g>
  <g class="cloud-2" opacity="0.20">
    <rect x="0" y="0" width="48" height="10" rx="5" fill="#64748B" />
    <rect x="12" y="-7" width="24" height="10" rx="5" fill="#64748B" />
  </g>

  <!-- ==========================================================
       GROUND TRACK (Solid ground at Y=200)
       ========================================================== -->
  <line x1="20" y1="200" x2="660" y2="200" stroke="#334155" stroke-width="2" />
  <g transform="translate(0, 204)">
    <g class="ground-track" fill="#475569">
      <circle cx="30" cy="3" r="1.5" /><circle cx="38" cy="6" r="1" />
      <circle cx="98" cy="4" r="1.5" /><circle cx="166" cy="5" r="1.5" />
      <circle cx="234" cy="3" r="1" /><circle cx="302" cy="6" r="1.5" />
      <circle cx="370" cy="4" r="1.5" /><circle cx="438" cy="5" r="1" />
      <circle cx="506" cy="3" r="1.5" /><circle cx="574" cy="6" r="1.5" />
      <circle cx="642" cy="4" r="1" /><circle cx="710" cy="3" r="1.5" />
    </g>
  </g>

  <!-- ==========================================================
       OBSTACLE 1: Overpriced Price Tag ($$$ Markup)
       Placed firmly on the ground: Top at Y=168, Base at Y=200
       ========================================================== -->
  <g class="hurdle-1">
    <!-- Red Price Tag Obstacle (32px high) -->
    <rect x="0" y="0" width="18" height="32" rx="3" fill="#180B0F" stroke="#EF4444" stroke-width="1.8" />
    <circle cx="9" cy="6" r="2.5" fill="#EF4444" />
    <text x="9" y="24" fill="#EF4444" font-family="'Courier New', monospace, sans-serif" font-size="11.5px" font-weight="900" text-anchor="middle">$$$</text>
  </g>

  <!-- ==========================================================
       BONUS ITEM: Shopping Bag 🛍️ (Floating mid-air at Y=112)
       ========================================================== -->
  <g class="deal-bag">
    <rect x="0" y="6" width="22" height="20" rx="3" fill="#064E3B" stroke="#10B981" stroke-width="1.5" filter="url(#glow-cyan)" />
    <path d="M 6,6 C 6,0 16,0 16,6" fill="none" stroke="#10B981" stroke-width="1.5" />
    <text x="11" y="20" fill="#6EE7B7" font-family="-apple-system, sans-serif" font-size="11px" font-weight="900" text-anchor="middle">🛍️</text>
  </g>

  <!-- ==========================================================
       OBSTACLE 2: High Fee Double Spike
       Placed firmly on the ground: Top at Y=168, Base at Y=200
       ========================================================== -->
  <g class="hurdle-2">
    <rect x="0" y="10" width="11" height="22" rx="2" fill="#180B0F" stroke="#F59E0B" stroke-width="1.6" />
    <rect x="14" y="0" width="11" height="32" rx="2" fill="#180B0F" stroke="#EF4444" stroke-width="1.6" />
    <text x="19.5" y="22" fill="#FCA5A5" font-family="'Courier New', monospace" font-size="9px" font-weight="900" text-anchor="middle">FEE</text>
  </g>

  <!-- ==========================================================
       OMNI RUNNER (Compact Voxel Bot: Top Y=144, Feet touch Y=200)
       ========================================================== -->
  <g class="omni-player">
    


    <g class="trotting-body">
      <!-- Mini Voxel Omni (Compact 0.85 scale) -->
      <g transform="scale(0.85) translate(-14, 0)">
        
        <!-- Jet Halo -->
        <ellipse cx="32" cy="36" rx="32" ry="32" fill="#84CC16" opacity="0.30" filter="url(#glow-green)" />

        <!-- Dome Armor -->
        <rect x="24" y="2" width="16" height="4" fill="#FFFFFF" />
        <rect x="20" y="4" width="24" height="4" fill="#F8FAFC" />
        <rect x="18" y="4" width="4" height="4" fill="#E2E8F0" />
        <rect x="42" y="4" width="4" height="4" fill="#94A3B8" />

        <!-- Ears -->
        <polygon points="16,8 22,2 24,8" fill="#FFFFFF" />
        <polygon points="18,7 22,3 23,7" fill="#84CC16" />
        <polygon points="48,8 42,2 40,8" fill="#94A3B8" />
        <polygon points="46,7 42,3 41,7" fill="#84CC16" />

        <!-- Head Shell -->
        <rect x="14" y="8" width="36" height="26" fill="#FFFFFF" rx="4" />
        <rect x="12" y="10" width="4" height="22" fill="#F1F5F9" />
        <rect x="14" y="8" width="4" height="24" fill="#E2E8F0" />
        <rect x="46" y="10" width="6" height="22" fill="#64748B" />
        <rect x="42" y="8" width="4" height="24" fill="#94A3B8" />

        <!-- Visor Cavity -->
        <rect x="16" y="14" width="32" height="18" fill="#060913" rx="4" />
        <rect x="18" y="16" width="28" height="14" fill="#02040A" />

        <!-- Focused Running Eyes -->
        <g filter="url(#glow-cyan)">
          <rect x="21" y="19" width="7" height="6" rx="1.5" fill="#38BDF8" />
          <rect x="25" y="20" width="2.5" height="2.5" fill="#FFFFFF" />
          <rect x="36" y="19" width="7" height="6" rx="1.5" fill="#38BDF8" />
          <rect x="40" y="20" width="2.5" height="2.5" fill="#FFFFFF" />
        </g>

        <!-- Lower Torso -->
        <rect x="14" y="36" width="36" height="14" fill="#FFFFFF" />
        <rect x="12" y="36" width="4" height="14" fill="#E2E8F0" />
        <rect x="46" y="36" width="4" height="14" fill="#64748B" />
        <rect x="42" y="36" width="4" height="14" fill="#94A3B8" />

        <!-- Core -->
        <rect x="28" y="40" width="8" height="6" fill="#84CC16" rx="2" filter="url(#glow-green)" />
        <rect x="30" y="42" width="4" height="2" fill="#FFFFFF" opacity="0.9" />

        <!-- Hover Thruster Running Jet Flames (Base reaches Y=58-64, touches 200px) -->
        <polygon points="16,50 24,50 20,62" fill="#38BDF8" />
        <polygon points="28,50 36,50 32,64" fill="#F59E0B" />
        <polygon points="40,50 48,50 44,62" fill="#38BDF8" />
      </g>
    </g>
  </g>

  <!-- ==========================================================
       FOOTER: Controls & How Omni works
       ========================================================== -->
  <g transform="translate(24, 238)">
    <text x="0" y="0" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11px" font-weight="600">
      🎮 <tspan fill="#94A3B8">Autonomous Runner Mode:</tspan> Omni jumps overpriced markups (<tspan fill="#EF4444">$$$</tspan>) and sniffs out best deals (<tspan fill="#10B981">🛍️</tspan>)!
    </text>
  </g>
</svg>
