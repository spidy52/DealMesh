<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" width="100%" height="330">
  <defs>
    <!-- Soft Glow Filters -->
    <filter id="glow-ambient-green" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-ambient-pink" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-ambient-red" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-eyes" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style><![CDATA[
      /* ==========================================================
         TOTAL EMOTIONAL STORYLINE: 20 Seconds Infinite Loop
         0s  - 4.5s:  SCOUTING / ROAMING (Alert Cyan Eyes)
         4.5s - 8.5s:  EXCITED / DEAL FOUND! (Glowing Pink Heart Eyes + Blush)
         8.5s - 12.5s: HARDBALL NEGOTIATION / ANGRY (Fierce Red Eyes + 💢)
         12.5s - 15.5s: VICTORY / WINK & SMILE (Happy Wink & Green Smile)
         15.5s - 20s:  SWEET SLEEP (Closed Slits, 3 Floating Z's, Breathing Aura)
         ========================================================== */

      /* Buttery smooth floating trajectory without jerky origin-rotation */
      @keyframes roamPlayground {
        0%   { transform: translate(140px, 120px); }
        15%  { transform: translate(260px, 95px); }
        30%  { transform: translate(350px, 125px); }
        45%  { transform: translate(280px, 140px); }
        60%  { transform: translate(160px, 115px); }
        /* Glides peacefully to center for bedtime */
        75%, 97% { transform: translate(235px, 120px); }
        100% { transform: translate(140px, 120px); }
      }

      /* Hovering vertical bob */
      @keyframes floatBob {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-7px); }
      }

      /* Subtle in-place screen-shake only during angry negotiation */
      @keyframes angryJitter {
        0%, 100% { transform: translate(0px, 0px); }
        25%      { transform: translate(-2px, 1px); }
        75%      { transform: translate(2px, -1px); }
      }

      /* Aura breath during sleep */
      @keyframes auraBreath {
        0%, 100% { opacity: 0.35; transform: scale(0.95); }
        50%      { opacity: 0.70; transform: scale(1.10); }
      }

      /* Sparkle pulse */
      @keyframes sparklePulse {
        0%, 100% { transform: scale(0.85); opacity: 0.6; }
        50%      { transform: scale(1.20); opacity: 1.0; }
      }

      /* Anger vein pulse */
      @keyframes veinPulse {
        0%, 100% { transform: scale(0.85); opacity: 0.7; }
        50%      { transform: scale(1.25); opacity: 1.0; }
      }

      /* EMOTION 1: SCOUTING (0% - 22%) */
      @keyframes emoScout {
        0%, 20%    { opacity: 1; }
        22%, 100%  { opacity: 0; }
      }

      /* EMOTION 2: EXCITED HEART EYES (22% - 42%) */
      @keyframes emoExcited {
        0%, 21%    { opacity: 0; }
        23%, 41%   { opacity: 1; }
        43%, 100%  { opacity: 0; }
      }

      /* EMOTION 3: ANGRY HARD NEGOTIATION (42% - 62%) */
      @keyframes emoAngry {
        0%, 41%    { opacity: 0; }
        43%, 61%   { opacity: 1; }
        63%, 100%  { opacity: 0; }
      }

      /* EMOTION 4: VICTORY WINK (62% - 76%) */
      @keyframes emoVictory {
        0%, 61%    { opacity: 0; }
        63%, 75%   { opacity: 1; }
        77%, 100%  { opacity: 0; }
      }

      /* EMOTION 5: SLEEPING (77% - 98%) */
      @keyframes emoSleep {
        0%, 75%    { opacity: 0; }
        77%, 97%   { opacity: 1; }
        99%, 100%  { opacity: 0; }
      }

      .actor-roaming {
        animation: roamPlayground 20s ease-in-out infinite;
      }
      .bobbing-group {
        animation: floatBob 2.6s ease-in-out infinite;
        transform-origin: 32px 36px;
      }
      .green-halo {
        animation: auraBreath 3.2s ease-in-out infinite;
        transform-origin: 32px 36px;
      }
      .sparkle-group {
        animation: sparklePulse 0.8s ease-in-out infinite;
        transform-origin: 58px 10px;
      }
      .anger-mark {
        animation: veinPulse 0.65s ease-in-out infinite;
        transform-origin: 64px 8px;
      }
      .angry-shaker {
        animation: angryJitter 0.25s ease-in-out infinite;
      }

      .state-scout    { animation: emoScout 20s ease-in-out infinite; }
      .state-excited  { animation: emoExcited 20s ease-in-out infinite; }
      .state-angry    { animation: emoAngry 20s ease-in-out infinite; }
      .state-victory  { animation: emoVictory 20s ease-in-out infinite; }
      .state-sleep    { animation: emoSleep 20s ease-in-out infinite; }
    ]]></style>
  </defs>

  <!-- Deep space chamber background -->
  <rect width="100%" height="100%" rx="16" fill="#030712" stroke="#1F2937" stroke-width="1.5" />

  <!-- Starfield background dots -->
  <g opacity="0.18" fill="#38BDF8">
    <circle cx="70" cy="50" r="1.5" />
    <circle cx="190" cy="40" r="1.5" />
    <circle cx="370" cy="65" r="1.5" />
    <circle cx="480" cy="95" r="1.5" />
    <circle cx="90" cy="220" r="1.5" />
    <circle cx="280" cy="265" r="1.5" />
    <circle cx="460" cy="235" r="1.5" />
  </g>

  <!-- ==========================================================
       TOP STATUS PILL (Displays Omni's Active Thought / Emotion)
       ========================================================== -->
  <g transform="translate(100, 18)">
    <rect x="0" y="0" width="340" height="32" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
    
    <!-- 1. Scouting Thought -->
    <g class="state-scout">
      <circle cx="22" cy="16" r="4.5" fill="#38BDF8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="20" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" font-weight="700">
        🔍 Scouting 20+ Stores for Best Price...
      </text>
    </g>

    <!-- 2. Excited Thought -->
    <g class="state-excited">
      <circle cx="22" cy="16" r="4.5" fill="#F43F5E">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="0.8s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="20" fill="#FDA4AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" font-weight="700">
        💖 Deal Found! 40% Off on Electronics!
      </text>
    </g>

    <!-- 3. Angry Thought -->
    <g class="state-angry">
      <circle cx="22" cy="16" r="4.5" fill="#EF4444">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="0.6s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="20" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" font-weight="700">
        💢 Merchant Countered! Negotiating Floor...
      </text>
    </g>

    <!-- 4. Victory Thought -->
    <g class="state-victory">
      <circle cx="22" cy="16" r="4.5" fill="#10B981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="20" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" font-weight="700">
        ✅ Lowest Price Locked! Verified on Chain!
      </text>
    </g>

    <!-- 5. Sleep Thought -->
    <g class="state-sleep">
      <circle cx="22" cy="16" r="4.5" fill="#84CC16">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="20" fill="#A3E635" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" font-weight="700">
        💤 Standing By... Say &quot;Hey Omni&quot; to Search
      </text>
    </g>
  </g>

  <!-- ==========================================================
       THE ROBOT ACTOR (Expressive Multi-Emotion Companion)
       ========================================================== -->
  <g class="actor-roaming">
    
    <!-- 1. Ambient Halos (Color changes per emotion) -->
    <g class="state-scout">
      <ellipse class="green-halo" cx="32" cy="38" rx="46" ry="46" fill="#38BDF8" opacity="0.35" filter="url(#glow-ambient-green)" />
    </g>
    <g class="state-excited">
      <ellipse class="green-halo" cx="32" cy="38" rx="50" ry="50" fill="#F43F5E" opacity="0.45" filter="url(#glow-ambient-pink)" />
      <!-- Excitement sparkles ✨ -->
      <g class="sparkle-group" transform="translate(56, 0)">
        <text x="0" y="8" fill="#FDE047" font-size="14" font-family="sans-serif">✨</text>
      </g>
    </g>
    <g class="state-angry">
      <ellipse class="green-halo" cx="32" cy="38" rx="52" ry="52" fill="#EF4444" opacity="0.55" filter="url(#glow-ambient-red)" />
      <!-- Anger mark veins 💢 -->
      <g class="anger-mark" transform="translate(62, -2)">
        <text x="0" y="10" fill="#EF4444" font-size="16" font-weight="black" font-family="sans-serif">💢</text>
      </g>
    </g>
    <g class="state-victory">
      <ellipse class="green-halo" cx="32" cy="38" rx="48" ry="48" fill="#10B981" opacity="0.40" filter="url(#glow-ambient-green)" />
    </g>
    <g class="state-sleep">
      <ellipse class="green-halo" cx="32" cy="38" rx="46" ry="46" fill="#84CC16" opacity="0.45" filter="url(#glow-ambient-green)" />

      <!-- 3 Staggered Floating Z's during sleep -->
      <g transform="translate(34, -10)">
        <text font-family="'Courier New', monospace, -apple-system, sans-serif" font-size="14px" font-weight="900" fill="#84CC16" filter="url(#glow-eyes)">
          z
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.25;0.75;1" dur="2.2s" begin="0s" repeatCount="indefinite" />
          <animate attributeName="y" values="4;-6;-14;-22" keyTimes="0;0.25;0.75;1" dur="2.2s" begin="0s" repeatCount="indefinite" />
        </text>
      </g>
      <g transform="translate(48, -22)">
        <text font-family="'Courier New', monospace, -apple-system, sans-serif" font-size="19px" font-weight="900" fill="#A3E635" filter="url(#glow-eyes)">
          z
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.25;0.75;1" dur="2.2s" begin="0.7s" repeatCount="indefinite" />
          <animate attributeName="y" values="4;-6;-14;-22" keyTimes="0;0.25;0.75;1" dur="2.2s" begin="0.7s" repeatCount="indefinite" />
        </text>
      </g>
      <g transform="translate(64, -36)">
        <text font-family="'Courier New', monospace, -apple-system, sans-serif" font-size="26px" font-weight="900" fill="#FFFFFF" filter="url(#glow-eyes)">
          Z
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.25;0.75;1" dur="2.2s" begin="1.4s" repeatCount="indefinite" />
          <animate attributeName="y" values="4;-6;-14;-22" keyTimes="0;0.25;0.75;1" dur="2.2s" begin="1.4s" repeatCount="indefinite" />
        </text>
      </g>
    </g>

    <!-- Bobbing Body -->
    <g class="bobbing-group">
      <g class="angry-shaker">
        <g transform="scale(1.35) translate(-4, 0)">
          <!-- Dome Armor -->
          <rect x="24" y="2" width="16" height="4" fill="#FFFFFF" />
          <rect x="20" y="4" width="24" height="4" fill="#F8FAFC" />
          <rect x="18" y="4" width="4" height="4" fill="#E2E8F0" />
          <rect x="42" y="4" width="4" height="4" fill="#94A3B8" />

          <!-- Ears -->
          <polygon points="16,8 22,2 24,8" fill="#FFFFFF" />
          <polygon points="18,7 22,3 23,7" fill="#84CC16" />
          <polygon points="48,8 42,2 40,8" fill="#94A3B8" />
          <polygon points="46,7 42,3 41,7" fill="#84CC16" />

          <!-- Head Shell -->
          <rect x="14" y="8" width="36" height="26" fill="#FFFFFF" rx="4" />
          <rect x="12" y="10" width="4" height="22" fill="#F1F5F9" />
          <rect x="14" y="8" width="4" height="24" fill="#E2E8F0" />
          <rect x="46" y="10" width="6" height="22" fill="#64748B" />
          <rect x="42" y="8" width="4" height="24" fill="#94A3B8" />

          <!-- Visor Cavity -->
          <rect x="16" y="14" width="32" height="18" fill="#060913" rx="4" />
          <rect x="18" y="16" width="28" height="14" fill="#02040A" />

          <!-- Emotions -->
          <g class="state-scout" filter="url(#glow-eyes)">
            <rect x="20" y="19" width="8" height="7" rx="2" fill="#38BDF8" /><rect x="24" y="20" width="3" height="3" fill="#FFFFFF" />
            <rect x="36" y="19" width="8" height="7" rx="2" fill="#38BDF8" /><rect x="40" y="20" width="3" height="3" fill="#FFFFFF" />
          </g>
          <g class="state-excited" filter="url(#glow-eyes)">
            <polygon points="21,18 24,16 27,18 27,22 24,25 21,22" fill="#F43F5E" />
            <polygon points="37,18 40,16 43,18 43,22 40,25 37,22" fill="#F43F5E" />
            <rect x="18" y="26" width="4" height="2" fill="#FB7185" opacity="0.8" />
            <rect x="42" y="26" width="4" height="2" fill="#FB7185" opacity="0.8" />
          </g>
          <g class="state-angry" filter="url(#glow-eyes)">
            <polygon points="18,18 30,24 28,27 18,21" fill="#EF4444" />
            <polygon points="46,18 34,24 36,27 46,21" fill="#EF4444" />
            <rect x="22" y="22" width="4" height="3" fill="#FCA5A5" /><rect x="38" y="22" width="4" height="3" fill="#FCA5A5" />
          </g>
          <g class="state-victory" filter="url(#glow-eyes)">
            <path d="M 20,24 Q 24,18 28,24" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
            <rect x="36" y="22" width="8" height="3" rx="1.5" fill="#10B981" />
          </g>
          <g class="state-sleep" filter="url(#glow-eyes)">
            <rect x="20" y="22" width="9" height="3" rx="1.5" fill="#84CC16" opacity="0.95" />
            <rect x="35" y="22" width="9" height="3" rx="1.5" fill="#84CC16" opacity="0.95" />
          </g>

          <!-- Torso -->
          <rect x="14" y="36" width="36" height="14" fill="#FFFFFF" />
          <rect x="12" y="36" width="4" height="14" fill="#E2E8F0" />
          <rect x="46" y="36" width="4" height="14" fill="#64748B" />
          <rect x="42" y="36" width="4" height="14" fill="#94A3B8" />

          <!-- Core -->
          <g class="state-scout"><rect x="28" y="40" width="8" height="6" fill="#38BDF8" rx="2" filter="url(#glow-eyes)" /></g>
          <g class="state-excited"><rect x="28" y="40" width="8" height="6" fill="#F43F5E" rx="2" filter="url(#glow-eyes)" /></g>
          <g class="state-angry"><rect x="28" y="40" width="8" height="6" fill="#EF4444" rx="2" filter="url(#glow-eyes)" /></g>
          <g class="state-victory"><rect x="28" y="40" width="8" height="6" fill="#10B981" rx="2" filter="url(#glow-eyes)" /></g>
          <g class="state-sleep"><rect x="28" y="40" width="8" height="6" fill="#84CC16" rx="2" filter="url(#glow-eyes)" /></g>
          <rect x="30" y="42" width="4" height="2" fill="#FFFFFF" opacity="0.9" />

          <!-- Thrusters -->
          <polygon points="16,50 24,50 20,58" fill="#38BDF8" opacity="0.8" />
          <polygon points="28,50 36,50 32,58" fill="#FFFFFF" />
          <polygon points="40,50 48,50 44,58" fill="#38BDF8" opacity="0.8" />
        </g>
      </g>
    </g>
  </g>

  <line x1="30" y1="315" x2="510" y2="315" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 6" />
</svg>
