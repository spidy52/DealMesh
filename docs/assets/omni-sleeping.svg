<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="100%" height="280">
  <defs>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes roamAndFloat {
        0% { transform: translate(0px, 0px); }
        25% { transform: translate(14px, -12px); }
        50% { transform: translate(-8px, -18px); }
        75% { transform: translate(-16px, -6px); }
        100% { transform: translate(0px, 0px); }
      }
      @keyframes floatZzz1 {
        0% { opacity: 0; transform: translateY(0px) scale(0.7); }
        40% { opacity: 1; transform: translateY(-10px) scale(1); }
        80% { opacity: 0; transform: translateY(-24px) scale(1.1); }
        100% { opacity: 0; }
      }
      @keyframes floatZzz2 {
        0% { opacity: 0; transform: translateY(0px) scale(0.6); }
        20% { opacity: 0; }
        60% { opacity: 1; transform: translateY(-12px) scale(0.9); }
        90% { opacity: 0; transform: translateY(-26px) scale(1.0); }
        100% { opacity: 0; }
      }
      @keyframes pulseAura {
        0%, 100% { opacity: 0.55; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }
      .pet-actor {
        animation: roamAndFloat 5.5s ease-in-out infinite;
        transform-origin: center;
      }
      .zzz-1 {
        animation: floatZzz1 3.2s ease-in-out infinite;
        font-family: 'Courier New', monospace, sans-serif;
        font-weight: bold;
        fill: #A3E635;
      }
      .zzz-2 {
        animation: floatZzz2 3.2s ease-in-out infinite;
        animation-delay: 1.2s;
        font-family: 'Courier New', monospace, sans-serif;
        font-weight: bold;
        fill: #A3E635;
      }
      .halo-aura {
        animation: pulseAura 3s ease-in-out infinite;
        transform-origin: 210px 185px;
      }
    </style>
  </defs>

  <!-- Dark Atmospheric Chamber Container -->
  <rect width="100%" height="100%" rx="18" fill="#080B10" stroke="#1F2937" stroke-width="1.5" />
  
  <!-- Subtle Grid Pattern in background -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="0.8">
    <line x1="40" y1="0" x2="40" y2="300" />
    <line x1="120" y1="0" x2="120" y2="300" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="280" y1="0" x2="280" y2="300" />
    <line x1="360" y1="0" x2="360" y2="300" />
    <line x1="0" y1="60" x2="420" y2="60" />
    <line x1="0" y1="140" x2="420" y2="140" />
    <line x1="0" y1="220" x2="420" y2="220" />
  </g>

  <!-- Prompt Badge at top -->
  <rect x="25" y="18" width="370" height="32" rx="16" fill="#111827" stroke="#374151" stroke-width="1" />
  <circle cx="42" cy="34" r="5" fill="#10B981">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="56" y="39" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" font-weight="600">
    Omni is peacefully resting in your workspace... <tspan fill="#F59E0B">👉 Poke me below!</tspan>
  </text>

  <!-- Animated Roaming Robot Actor -->
  <g class="pet-actor">
    <!-- Glowing Soft Aura Behind Robot -->
    <ellipse class="halo-aura" cx="210" cy="185" rx="65" ry="65" fill="#10B981" opacity="0.3" filter="url(#glow-cyan)" />

    <!-- Floating Zzz Speech Bubble -->
    <g transform="translate(195, 68)">
      <path d="M 30,35 Q 30,10 65,10 Q 100,10 100,35 Q 100,55 75,55 L 55,68 L 58,55 Q 30,55 30,35 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" />
      <text x="52" y="38" font-family="'Courier New', monospace, sans-serif" font-size="15px" font-weight="800" fill="#0F172A">Zzz...</text>
    </g>

    <!-- Floating Zzz particles -->
    <text x="290" y="78" class="zzz-1" font-size="15px">z</text>
    <text x="306" y="64" class="zzz-2" font-size="19px">Z</text>

    <!-- Robot Group Centered at (210, 180) -->
    <g transform="translate(155, 120)">
      <!-- Antenna Ears (Lime Green Triangles) -->
      <polygon points="16,14 26,0 36,14" fill="#84CC16" />
      <polygon points="74,14 84,0 94,14" fill="#84CC16" />

      <!-- Head Chassis (Futuristic White Box with chamfers) -->
      <path d="M 12,14 L 98,14 Q 104,14 104,22 L 104,78 Q 104,84 98,84 L 12,84 Q 6,84 6,78 L 6,22 Q 6,14 12,14 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2" />
      <rect x="12" y="10" width="86" height="8" rx="3" fill="#F8FAFC" />

      <!-- Dark Visor Screen -->
      <rect x="16" y="24" width="78" height="46" rx="10" fill="#0B0F19" stroke="#1E293B" stroke-width="1.5" />

      <!-- Sleeping Eyes (Lime Green Horizontal Neon Slits) -->
      <g filter="url(#glow-green)">
        <rect x="26" y="44" width="22" height="7" rx="3" fill="#A3E635" />
        <rect x="62" y="44" width="22" height="7" rx="3" fill="#A3E635" />
      </g>

      <!-- Torso / Lower Body -->
      <path d="M 16,88 L 94,88 L 90,122 L 20,122 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.8" />
      
      <!-- Core Status LED (Sleeping Green Pill) -->
      <rect x="44" y="98" width="22" height="11" rx="5" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <rect x="47" y="101" width="16" height="5" rx="2.5" fill="#A3E635" filter="url(#glow-green)" />

      <!-- Hover Thrusters (3 Inverted White/Grey Spikes) -->
      <polygon points="26,122 35,138 44,122" fill="#CBD5E1" />
      <polygon points="48,122 55,142 62,122" fill="#E2E8F0" />
      <polygon points="66,122 75,138 84,122" fill="#CBD5E1" />

      <!-- Thruster Glow Sparks -->
      <ellipse cx="55" cy="144" rx="16" ry="4" fill="#38BDF8" opacity="0.6" filter="url(#glow-cyan)" />
    </g>
  </g>
</svg>
